[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flightwatch"
version = "0.1.0"
description = "Split long-haul flights into separately booked segments and find which leg is worth upgrading to business class."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "flightwatch contributors" }]
keywords = [
  "flight",
  "travel",
  "fare-comparison",
  "business-class",
  "kiwi",
  "self-transfer",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
# 刻意保持零依赖：只用 Python 标准库
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
flightwatch = "flightwatch.cli:main"

[project.urls]
Homepage = "https://github.com/<your-name>/flightwatch"
Issues = "https://github.com/<your-name>/flightwatch/issues"

[tool.setuptools]
packages = ["flightwatch", "flightwatch.engine", "flightwatch.providers"]
include-package-data = true

[tool.setuptools.package-data]
flightwatch = ["web/*"]
